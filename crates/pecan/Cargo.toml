[package]
name = "pecan"
description = "Fast local browser for pi coding-agent sessions: projects, threads, settle, steer"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "pecan"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pecan-core = { path = "../pecan-core" }

axum = "0.8"
futures = "0.3"
getrandom = "0.4"
jiff = { workspace = true }
notify = "8"
notify-debouncer-full = "0.5"
rust-embed = { version = "8", features = ["compression", "deterministic-timestamps"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
