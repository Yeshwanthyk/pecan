[package]
name = "pecan"
description = "Fast local browser for pi coding-agent sessions: projects, threads, settle, steer"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[[bin]]
name = "pecan"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pecan-core = { path = "../pecan-core" }

axum = "0.8"
futures = "0.3"
getrandom = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
jiff = { workspace = true }
notify = "8"
notify-debouncer-full = "0.5"
rust-embed = { version = "8", features = ["compression", "deterministic-timestamps"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
tokio = { version = "1", features = ["fs", "process", "rt-multi-thread", "macros", "sync", "time", "signal", "io-util"] }
tower = "0.5"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "native-tokio", "tls12"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
base64 = "0.23.1"
