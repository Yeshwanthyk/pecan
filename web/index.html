<!doctype html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>pecan</title>
<script>
  // Apply persisted theme before first paint.
  try {
    var t = localStorage.getItem("pecan:theme") ?? "earl-grey-light";
    document.documentElement.classList.toggle("dark", t === "one-dark");
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
